<html>
    <body>
        <script>
            let marks = 99;
            let grade;
            if(marks >= 90)
            {
                grade = 'A';
            }

            else if(marks >= 60 && marks < 90)
            {
                grade = 'B';
            }

            else
            {
                grade = 'F';
            }

            console.log(grade);
        </script>
    </body>
</html>
