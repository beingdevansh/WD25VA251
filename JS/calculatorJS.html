<html>
    <body>
        <script>
            function calc(op)
            {
                var a = 5;
                var b = 10;
                if(op == '+')
                {
                    console.log(a+b);
                }

                else if(op == '-')
                {
                    console.log(a-b);
                }

                else if(op == '*')
                {
                    console.log(a*b);
                }

                else if(op == '/')
                {
                    console.log(a/b);
                }

                else
                {
                    console.log("Wrong operator");
                }
            }

            calc('+');
        </script>
    </body>
</html>
